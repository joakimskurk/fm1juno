name: MAME original six-voice loop gate

on:
  pull_request:
    paths:
      - "tests/cpu_ic29/run_mame_six_voice_original_loop.py"
      - "tests/cpu_ic29/run_mame_vcf_original_attack_probe.py"
      - "tests/cpu_ic29/run_mame_vcf_original_decay_release_probe.py"
      - "src/control106/**"
      - ".github/workflows/mame-six-voice-loop.yml"
  workflow_dispatch:

jobs:
  original-six-voice:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install independent MAME CPU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mame
      - name: Compile real production envelope and VCF references
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel --target fm1juno_envelope_attack_reference fm1juno_envelope_decay_release_reference fm1juno_vcf_global_reference fm1juno_vcf_chain_reference
      - name: Fetch public IC29 transcription (not a full authenticated original ROM)
        run: |
          curl --fail --location --silent --show-error --retry 3 --max-time 30 \
            https://raw.githubusercontent.com/ErroneousBosh/j106roms/master/ic29.txt \
            --output build/ic29_public_disassembly.txt
      - name: Run authentic six-voice ENV and VCF loop without synthetic internal jumps
        run: |
          python3 -u tests/cpu_ic29/run_mame_six_voice_original_loop.py \
            --ic29-disasm build/ic29_public_disassembly.txt \
            --attack-cli build/fm1juno_envelope_attack_reference \
            --decay-cli build/fm1juno_envelope_decay_release_reference \
            --global-cli build/fm1juno_vcf_global_reference \
            --voice-cli build/fm1juno_vcf_chain_reference \
            --mame /usr/games/mame \
            --case-timeout 14
